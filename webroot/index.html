<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Strong Guard</title>
<style>
:root{
  --primary:#d0bcff; --on-primary:#381e72;
  --primary-container:#4f378b; --on-primary-container:#eaddff;
  --secondary-container:#4a4458; --on-secondary-container:#e8def8;
  --surface:#141218; --surface-low:#1d1b20; --surface-c:#211f26;
  --surface-high:#2b2930; --surface-highest:#36343b;
  --on-surface:#e6e0e9; --on-surface-var:#cac4d0;
  --outline:#938f99; --outline-var:#49454f;
  --error:#f2b8b5; --on-error:#601410;
  --error-c:#8c1d18; --on-error-c:#f9dedc;
  --success:#6dd58c; --success-c:#0b5223; --on-success-c:#c4f0cf;
  --r-xl:28px; --r-l:16px; --r-m:12px; --r-s:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--surface);color:var(--on-surface);
  font-family:Roboto,system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:15px;line-height:1.45}
body{padding:0 14px 28px}
.ic{width:22px;height:22px;fill:currentColor;flex:0 0 auto;display:inline-block;vertical-align:middle}

/* top app bar */
.appbar{position:sticky;top:0;z-index:5;background:var(--surface);padding:14px 2px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .ic{width:28px;height:28px;color:var(--primary)}
.brand h1{font-size:20px;font-weight:500;margin:0;letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--on-surface-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--on-surface-var);font-family:inherit;
  font-size:12.5px;font-weight:600;padding:7px 12px}
.seg button.on{background:var(--secondary-container);color:var(--on-secondary-container)}

/* cards */
.card{background:var(--surface-c);border-radius:var(--r-l);padding:16px;margin-top:12px}
.card .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .card-head .ic{width:20px;height:20px;color:var(--primary)}
.card .card-head h2{font-size:14px;font-weight:600;margin:0;flex:1}
.iconbtn{border:0;background:transparent;color:var(--on-surface-var);padding:8px;border-radius:999px;display:flex}
.iconbtn:active{background:var(--surface-highest)}

/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row+.row{border-top:1px solid var(--outline-var)}
.row .ic{width:20px;height:20px;color:var(--on-surface-var)}
.row .k{flex:1;color:var(--on-surface-var);font-size:13.5px;min-width:0}
.row .v{font-size:13.5px;text-align:right;word-break:break-all;max-width:58%}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  border-radius:var(--r-s);padding:7px 12px;border:1px solid var(--outline-var);
  background:var(--surface-highest);color:var(--on-surface-var)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.chip.pass{background:var(--success-c);border-color:transparent;color:var(--on-success-c)}
.chip.fail{background:var(--error-c);border-color:transparent;color:var(--on-error-c)}
.chip.unknown{background:var(--surface-highest);border-color:var(--outline-var);color:var(--on-surface-var)}

/* buttons */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{border:0;border-radius:999px;padding:13px 14px;font-family:inherit;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn .ic{width:19px;height:19px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.danger{background:var(--error-c);color:var(--on-error-c)}
.btn.text{background:transparent;color:var(--primary)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}
.btn.wide{grid-column:1 / -1}

/* settings rows with M3 switch */
.set-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.set-row+.set-row{border-top:1px solid var(--outline-var)}
.set-row .k{flex:1;font-size:14px}
.switch{position:relative;width:52px;height:32px;border-radius:16px;flex:0 0 auto;
  background:var(--surface-highest);border:2px solid var(--outline);transition:.18s}
.switch::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;
  background:var(--outline);transform:translateY(-50%);transition:.18s}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{left:24px;width:24px;height:24px;background:var(--on-primary)}

/* log */
pre{display:none;background:var(--surface-low);border-radius:var(--r-m);padding:12px;margin:12px 0 0;
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:11px;line-height:1.55;max-height:320px;
  overflow:auto;white-space:pre-wrap;word-break:break-all;color:#cfc9d6}
pre.show{display:block}

/* snackbar */
#snack{position:fixed;left:16px;right:16px;bottom:20px;background:#e6e0e9;color:#322f35;
  border-radius:var(--r-s);padding:13px 16px;font-size:13.5px;text-align:center;
  transform:translateY(140%);opacity:0;transition:.25s;z-index:20;pointer-events:none}
#snack.show{transform:translateY(0);opacity:1}
.foot{color:var(--on-surface-var);font-size:11px;text-align:center;margin:18px 4px 0;line-height:1.6}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script>
const MOD='/data/adb/modules/strong_guard';

const I18N={
 ja:{
  "app.sub":"Play Integrity STRONG 自動維持モジュール",
  "verdict.title":"Play Integrity 判定",
  "verdict.last":"最終判定",
  "keybox.title":"現在の keybox",
  "keybox.expiry":"有効期限",
  "keybox.remaining":"残り",
  "keybox.serial":"EC leaf serial",
  "keybox.rsa":"RSA チェーン",
  "keybox.yes":"あり","keybox.no":"なし",
  "status.title":"動作状態",
  "status.sources":"ソース",
  "status.lastFetch":"最終フェッチ",
  "status.intervals":"確認 / 判定間隔",
  "status.running":"稼働","status.stopped":"停止","status.idle":"待機","status.busy":"実行中",
  "auto.title":"自動化設定",
  "auto.rotate":"自動回復",
  "auto.notify":"通知",
  "btn.fetch":"keybox取得","btn.check":"STRONG再判定","btn.rotate":"今すぐ回復",
  "btn.rotateBusy":"回復中…","btn.logShow":"ログ表示","btn.logHide":"ログを隠す",
  "unit.days":"日","unit.min":"分","unit.hour":"時間",
  "toast.refreshed":"更新しました",
  "toast.fetching":"keyboxを取得しています…",
  "toast.checking":"STRONG判定を開始しました…",
  "toast.rotating":"緊急回復を開始しました…",
  "toast.auto":"自動回復",
  "toast.notify":"通知",
  "on":"ON","off":"OFF","empty":"(ログなし)",
  "footer.1":"keyboxは公開ソース（MeowDump / Yurikey）から自動取得します",
  "footer.2":"全ソースが失効した場合は新しいkeyboxが配布されるまで回復できません"
 },
 en:{
  "app.sub":"Play Integrity STRONG auto-keeper",
  "verdict.title":"Play Integrity verdict",
  "verdict.last":"Last check",
  "keybox.title":"Current keybox",
  "keybox.expiry":"Expires",
  "keybox.remaining":"Remaining",
  "keybox.serial":"EC leaf serial",
  "keybox.rsa":"RSA chain",
  "keybox.yes":"present","keybox.no":"missing",
  "status.title":"Status",
  "status.sources":"Sources",
  "status.lastFetch":"Last fetch",
  "status.intervals":"Health / verdict interval",
  "status.running":"running","status.stopped":"stopped","status.idle":"idle","status.busy":"running",
  "auto.title":"Automation",
  "auto.rotate":"Auto recovery",
  "auto.notify":"Notifications",
  "btn.fetch":"Fetch keybox","btn.check":"Re-check STRONG","btn.rotate":"Recover now",
  "btn.rotateBusy":"Recovering…","btn.logShow":"Show log","btn.logHide":"Hide log",
  "unit.days":"days","unit.min":"min","unit.hour":"h",
  "toast.refreshed":"Refreshed",
  "toast.fetching":"Fetching keybox…",
  "toast.checking":"Starting STRONG check…",
  "toast.rotating":"Starting emergency recovery…",
  "toast.auto":"Auto recovery",
  "toast.notify":"Notifications",
  "on":"ON","off":"OFF","empty":"(no log)",
  "footer.1":"Keyboxes are fetched automatically from public sources (MeowDump / Yurikey)",
  "footer.2":"If every source is revoked, recovery has to wait for a fresh keybox to be published"
 }
};

let lang=localStorage.getItem('sg_lang')||((navigator.language||'en').toLowerCase().startsWith('ja')?'ja':'en');
const t=(k)=>(I18N[lang]&&I18N[lang][k])||I18N.en[k]||k;

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('#langseg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  const l=document.getElementById('logbox');
  document.getElementById('act-log').querySelector('span').textContent=l.classList.contains('show')?t('btn.logHide'):t('btn.logShow');
  if(lastInfo) render(lastInfo);
}

function api(){return (window.ksu&&window.ksu.exec)?window.ksu:((window.kernelsu&&window.kernelsu.exec)?window.kernelsu:null);}
function norm(res){
  if(res==null)return{errno:0,stdout:'',stderr:''};
  if(typeof res==='object')return{errno:(res.errno??0),stdout:(res.stdout??''),stderr:(res.stderr??'')};
  return{errno:0,stdout:String(res),stderr:''};
}
async function sh(cmd){
  const k=api();
  if(!k)return{errno:1,stdout:'',stderr:'no webui api'};
  try{
    const m=k.exec(cmd);
    if(m&&typeof m.then==='function')return norm(await m);
    if(typeof m==='string')return{errno:0,stdout:m,stderr:''};
  }catch(e){}
  return await new Promise((resolve)=>{
    const cb='cb_'+Date.now()+'_'+((Math.random()*10000)|0);
    let done=false;
    const fin=(c,o,e)=>{if(done)return;done=true;delete window[cb];resolve({errno:c||0,stdout:o||'',stderr:e||''});};
    window[cb]=(c,o,e)=>fin(c,o,e);
    try{k.exec(cmd,'{}',cb);}catch(e){fin(1,'',String(e));}
    setTimeout(()=>fin(1,'','timeout'),8000);
  });
}
function snack(msg){
  const el=document.getElementById('snack');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(window.__sn);window.__sn=setTimeout(()=>el.classList.remove('show'),2200);
  try{if(window.kernelsu&&kernelsu.toast)kernelsu.toast(msg);}catch(e){}
}
function parseKV(text){
  const o={};(text||'').split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)o[l.slice(0,i)]=l.slice(i+1);});
  return o;
}
function fmtTs(ts){
  if(!ts)return '-';
  const n=parseInt(ts,10);if(!n)return '-';
  const d=new Date(n*1000),p=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function chipState(id,state,label){
  const el=document.getElementById(id);
  el.className='chip '+(state==='Pass'?'pass':state==='Fail'?'fail':'unknown');
  el.innerHTML='<span class="dot"></span><span>'+label+'</span>';
  el.style.display='inline-flex';
}
function toggleChip(id,on,label){
  const el=document.getElementById(id);
  el.className='chip '+(on?'pass':'unknown');
  el.innerHTML='<span class="dot"></span><span>'+label+'</span>';
}
let lastInfo=null;
function render(info){
  const v=parseKV((info.verdict||'').replace(/ /g,'\n'));
  chipState('b-basic',v['basic'],'BASIC');
  chipState('b-device',v['device'],'DEVICE');
  chipState('b-strong',v['strong'],'STRONG');
  document.getElementById('verdict-ts').textContent=fmtTs(info.verdict_ts);

  document.getElementById('expiry').textContent=info.expiry_str||'-';
  const days=info.expiry_days,dEl=document.getElementById('expiry-days');
  if(days===''||days===undefined){dEl.textContent='-';dEl.style.color='';}
  else{dEl.textContent=days+' '+t('unit.days');dEl.style.color=(parseInt(days)<=5)?'var(--error)':'';}
  document.getElementById('ecserial').textContent=(info.ec_serial||'-').slice(0,24);
  document.getElementById('rsa').textContent=(info.rsa==='yes')?t('keybox.yes'):t('keybox.no');

  toggleChip('c-omk',info.omk==='yes','OMK: '+(info.omk==='yes'?t('status.running'):t('status.stopped')));
  toggleChip('c-daemon',info.daemon==='running','daemon: '+(info.daemon==='running'?t('status.running'):t('status.stopped')));
  toggleChip('c-rot',info.rotating!=='yes','rotate: '+(info.rotating==='yes'?t('status.busy'):t('status.idle')));
  toggleChip('c-chk',info.checking!=='yes','check: '+(info.checking==='yes'?t('status.busy'):t('status.idle')));

  document.getElementById('sources').textContent=info.sources||'-';
  document.getElementById('fetch-ts').textContent=fmtTs(info.fetch_ts);
  document.getElementById('intervals').textContent=(info.ci||'-')+t('unit.min')+' / '+(info.vi||'-')+t('unit.hour');

  document.getElementById('t-auto').classList.toggle('on',info.auto_rotate==='1');
  document.getElementById('t-notify').classList.toggle('on',info.notify==='1');

  const busy=info.rotating==='yes';
  const rb=document.getElementById('act-rotate');
  rb.disabled=busy;
  rb.querySelector('span').textContent=busy?t('btn.rotateBusy'):t('btn.rotate');
}
async function refresh(){
  const r=await sh('sh '+MOD+'/webui.sh info');
  lastInfo=parseKV(r.stdout);
  render(lastInfo);
}
async function doAction(cmd,msg){
  snack(msg);
  await sh('sh '+MOD+'/webui.sh '+cmd);
  setTimeout(refresh,1200);
}
document.getElementById('btn-refresh').onclick=()=>{refresh();snack(t('toast.refreshed'));};
document.getElementById('act-fetch').onclick=()=>doAction('fetch',t('toast.fetching'));
document.getElementById('act-check').onclick=()=>doAction('start-check',t('toast.checking'));
document.getElementById('act-rotate').onclick=()=>doAction('start-rotate',t('toast.rotating'));
document.getElementById('act-log').onclick=async()=>{
  const box=document.getElementById('logbox');
  if(box.classList.contains('show')){box.classList.remove('show');applyLang();return;}
  const r=await sh('sh '+MOD+'/webui.sh log');
  box.textContent=r.stdout||t('empty');
  box.classList.add('show');
  box.scrollTop=box.scrollHeight;
  applyLang();
};
document.getElementById('t-auto').onclick=async()=>{
  if(!lastInfo)return;
  const nv=lastInfo.auto_rotate==='1'?'0':'1';
  await sh('sh '+MOD+'/webui.sh set AUTO_ROTATE '+nv);
  snack(t('toast.auto')+': '+(nv==='1'?t('on'):t('off')));
  refresh();
};
document.getElementById('t-notify').onclick=async()=>{
  if(!lastInfo)return;
  const nv=lastInfo.notify==='1'?'0':'1';
  await sh('sh '+MOD+'/webui.sh set NOTIFY '+nv);
  snack(t('toast.notify')+': '+(nv==='1'?t('on'):t('off')));
  refresh();
};
document.getElementById('langseg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang]');
  if(!b)return;
  lang=b.dataset.lang;localStorage.setItem('sg_lang',lang);applyLang();
});
try{if(window.kernelsu&&kernelsu.fullScreen)kernelsu.fullScreen(true);}catch(e){}
applyLang();
refresh();
setInterval(refresh,4000);
</script>
</body>
</html>
